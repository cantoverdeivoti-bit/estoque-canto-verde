<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem de Estoque - Canto Verde</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3b82f6;
            --success: #16a34a;
            --bg: #f5f5f5;
            --surface: #fff;
            --text: #1a1a1a;
            --border: #e0e0e0;
            --radius: 16px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a1a;
                --surface: #2a2a2a;
                --text: #f0f0f0;
                --border: #404040;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 1.5rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 0.5rem;
        }

        .info {
            background: var(--surface);
            padding: 1rem;
            border-radius: var(--radius);
            margin-bottom: 2rem;
            border: 1px solid var(--border);
            text-align: center;
        }

        .setor {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .setor-header {
            background: var(--primary);
            color: white;
            padding: 1rem;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setor-header:hover {
            background: #2563eb;
        }

        .setor-content {
            padding: 1.5rem;
            display: none;
        }

        .setor-content.open {
            display: block;
        }

        .produto {
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .produto:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .produto-nome {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 14px;
        }

        .estoque-ideal {
            font-size: 12px;
            color: #666;
            margin-bottom: 0.5rem;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
        }

        .checkmark {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s;
        }

        .checkmark.active {
            background: var(--success);
            color: white;
        }

        .btn-salvar {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            margin-top: 2rem;
            position: sticky;
            bottom: 1.5rem;
            font-size: 16px;
        }

        .btn-salvar:hover {
            background: #2563eb;
        }

        .status {
            font-size: 12px;
            color: #666;
            margin-top: 0.5rem;
        }

        .status.enviado {
            color: var(--success);
        }

        .link-painel {
            background: var(--primary);
            color: white;
            padding: 12px;
            border-radius: var(--radius);
            text-align: center;
            margin-bottom: 2rem;
            text-decoration: none;
            display: inline-block;
            width: 100%;
            font-weight: 600;
        }

        .link-painel:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

        <a href="painel.html" class="link-painel">👀 Ver Painel de Gerenciamento</a>

        let dados = {};

        function inicializar() {
            carregarDados();
            renderizar();
            document.getElementById('status').textContent = '✅ Sincronizando com Firebase';
        }

        function carregarDados() {
            database.ref('estoque').on('value', (snapshot) => {
                if (snapshot.exists()) {
                    dados = snapshot.val();
                } else {
                    dados = {};
                }
                renderizar();
            });
        }

        function renderizar() {
            const container = document.getElementById('setores');
            container.innerHTML = '';

            Object.keys(estoqueDoGoogleDrive).forEach(setor => {
                const setorDiv = document.createElement('div');
                setorDiv.className = 'setor';

                const header = document.createElement('div');
                header.className = 'setor-header';
                header.innerHTML = `
                    <span>${setor}</span>
                    <i class="fas fa-chevron-down"></i>
                `;

                header.onclick = () => {
                    content.classList.toggle('open');
                    header.querySelector('i').style.transform = content.classList.contains('open') ? 'rotate(180deg)' : '';
                };

                const content = document.createElement('div');
                content.className = 'setor-content';

                const produtos = estoqueDoGoogleDrive[setor];
                Object.keys(produtos).forEach(produto => {
                    const chave = `${setor}|${produto}`;
                    const valor = dados[chave] || '';
                    const ideal = produtos[produto];

                    const produtoDiv = document.createElement('div');
                    produtoDiv.className = 'produto';
                    produtoDiv.innerHTML = `
                        <div class="produto-nome">${produto}</div>
                        <div class="estoque-ideal">Ideal: ${ideal}</div>
                        <div class="input-group">
                            <input type="text" 
                                   id="input_${chave}" 
                                   value="${valor}"
                                   placeholder="Ex: 123,50"
                                   oninput="atualizar('${chave}')">
                            <div class="checkmark ${valor ? 'active' : ''}" id="check_${chave}">
                                ${valor ? '✓' : ''}
                            </div>
                        </div>
                    `;

                    content.appendChild(produtoDiv);
                });

                setorDiv.appendChild(header);
                setorDiv.appendChild(content);
                container.appendChild(setorDiv);
            });
        }

        function atualizar(chave) {
            const input = document.getElementById(`input_${chave}`);
            const check = document.getElementById(`check_${chave}`);
            const valor = input.value;

            dados[chave] = valor;

            if (valor) {
                check.classList.add('active');
                check.textContent = '✓';
            } else {
                check.classList.remove('active');
                check.textContent = '';
            }

            // Salva no Firebase em tempo real
            database.ref(`estoque/${chave}`).set(valor);
        }

        function salvarTodos() {
            alert('✅ Contagem salva! Painel atualizado em tempo real!');
        }

        inicializar();
    </script>
</body>
</html>
