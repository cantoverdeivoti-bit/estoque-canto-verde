    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --text-primary: #1a1a1a;
            --text-secondary: #666;
            --text-muted: #999;
            --surface-0: #f5f5f5;
            --surface-1: #efefef;
            --surface-2: #ffffff;
            --border: #e0e0e0;
            --border-strong: #ccc;
            --fill-accent: #3b82f6;
            --on-accent: #ffffff;
            --bg-accent: #dbeafe;
            --text-accent: #1e40af;
            --bg-warning: #fef3c7;
            --text-warning: #92400e;
            --bg-success: #dcfce7;
            --text-success: #166534;
            --bg-danger: #fee2e2;
            --text-danger: #991b1b;
            --radius: 16px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text-primary: #f0f0f0;
                --text-secondary: #b0b0b0;
                --text-muted: #808080;
                --surface-0: #1a1a1a;
                --surface-1: #2a2a2a;
                --surface-2: #3a3a3a;
                --border: #404040;
                --border-strong: #505050;
                --fill-accent: #3b82f6;
                --on-accent: #ffffff;
                --bg-accent: #1e3a8a;
                --text-accent: #93c5fd;
                --bg-warning: #78350f;
                --text-warning: #fcd34d;
                --bg-success: #064e3b;
                --text-success: #86efac;
                --bg-danger: #7f1d1d;
                --text-danger: #fca5a5;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--surface-0);
            color: var(--text-primary);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 500;
            margin: 0 0 0.5rem 0;
            color: var(--text-primary);
        }

        .header p {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0;
        }

        .add-product-btn {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .add-btn {
            padding: 10px 20px;
            background: var(--fill-accent);
            color: var(--on-accent);
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .add-btn:hover {
            opacity: 0.9;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: var(--surface-2);
            border-radius: 24px;
            border: 0.5px solid var(--border);
            padding: 1.5rem;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }

        .modal h2 {
            font-size: 18px;
            font-weight: 500;
            margin: 0 0 1rem 0;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 10px 14px;
            border: 0.5px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            color: var(--text-primary);
            background: var(--surface-1);
            font-family: inherit;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--border-strong);
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 1.5rem;
        }

        .modal-buttons button {
            flex: 1;
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .confirm-btn {
            background: var(--fill-accent);
            color: var(--on-accent);
        }

        .confirm-btn:hover {
            opacity: 0.9;
        }

        .cancel-btn {
            background: transparent;
            border: 0.5px solid var(--border-strong);
            color: var(--text-primary);
        }

        .cancel-btn:hover {
            background: var(--surface-1);
        }

        .setor-section {
            margin-bottom: 2rem;
        }

        .setor-header {
            background: var(--fill-accent);
            color: var(--on-accent);
            padding: 12px 16px;
            border-radius: var(--radius);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
            margin-bottom: 1rem;
            user-select: none;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .setor-header:hover {
            opacity: 0.95;
        }

        .setor-icon {
            font-size: 18px;
            transition: transform 0.2s;
        }

        .setor-header.aberto .setor-icon {
            transform: rotate(90deg);
        }

        .setor-conteudo {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .setor-conteudo.aberto {
            max-height: 5000px;
        }

        .item-estoque {
            background: var(--surface-2);
            border: 0.5px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .item-estoque.salvo {
            border: 0.5px solid var(--text-success);
            background: var(--bg-success);
        }

        .item-estoque.novo {
            border: 0.5px solid var(--text-accent);
            background: var(--bg-accent);
        }

        .item-header {
            display: grid;
            grid-template-columns: 1fr 160px;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .item-nome-info {
            flex: 1;
        }

        .item-nome {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin: 0 0 4px 0;
        }

        .item-estoque.salvo .item-nome {
            color: var(--text-success);
        }

        .item-estoque.novo .item-nome {
            color: var(--text-accent);
        }

        .item-info {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 0;
        }

        .item-estoque.salvo .item-info {
            color: var(--text-success);
        }

        .item-estoque.novo .item-info {
            color: var(--text-accent);
        }

        .item-input-wrapper {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .item-input {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .item-input label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 500;
        }

        .item-input input {
            padding: 6px 8px;
            border: 0.5px solid var(--border);
            border-radius: var(--radius);
            font-size: 12px;
            color: var(--text-primary);
            background: var(--surface-1);
            font-weight: 500;
            width: 70px;
            text-align: center;
        }

        .item-input input:focus {
            outline: none;
            border-color: var(--border-strong);
        }

        .checkmark-badge {
            background: var(--text-success);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .item-estoque.salvo .checkmark-badge {
            display: flex;
        }

        .item-footer {
            display: flex;
            gap: 8px;
            padding-top: 8px;
            border-top: 0.5px solid var(--border);
        }

        .item-footer-input {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .item-footer-input label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 500;
        }

        .item-footer-input input {
            padding: 8px 12px;
            border: 0.5px solid var(--text-warning);
            border-radius: var(--radius);
            font-size: 13px;
            color: var(--text-primary);
            background: var(--bg-warning);
        }

        .item-footer-input input::placeholder {
            color: var(--text-muted);
        }

        .delete-btn {
            background: var(--bg-danger);
            color: var(--text-danger);
            border: 0.5px solid var(--text-danger);
            padding: 4px 8px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 12px;
            align-self: flex-end;
        }

        .delete-btn:hover {
            opacity: 0.8;
        }

        .footer {
            position: sticky;
            bottom: 0;
            background: var(--surface-0);
            padding: 1rem;
            border-top: 0.5px solid var(--border);
            display: flex;
            gap: 8px;
            margin: 2rem -1.5rem -1.5rem -1.5rem;
        }

        .save-btn {
            flex: 1;
            padding: 12px 16px;
            background: var(--fill-accent);
            color: var(--on-accent);
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .save-btn:hover {
            opacity: 0.9;
        }

        .save-btn:active {
            transform: scale(0.98);
        }

        .error {
            background: var(--bg-danger);
            color: var(--text-danger);
            padding: 12px;
            border-radius: var(--radius);
            margin-bottom: 1rem;
            font-size: 13px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .success {
            background: var(--bg-success);
            color: var(--text-success);
            padding: 12px;
            border-radius: var(--radius);
            margin-bottom: 1rem;
            font-size: 13px;
            display: none;
            position: fixed;
            top: 1rem;
            left: 1rem;
            right: 1rem;
            max-width: 500px;
            z-index: 1000;
        }

        .success.show {
            display: block;
        }

        .badge-novo {
            display: inline-block;
            background: var(--bg-accent);
            color: var(--text-accent);
            padding: 2px 6px;
            border-radius: var(--radius);
            font-size: 11px;
            font-weight: 500;
            margin-left: 4px;
        }
    </style>
</head>

                <div class="modal-buttons">

                    <button class="cancel-btn" onclick="fecharModal()">Cancelar</button>
                </div>
            </div>
        </div>

        <div id="setores"></div>

        <div class="footer">
            <button class="save-btn" onclick="salvarTodos()">

            document.getElementById('novoProdutoNome').focus();
        }

        function fecharModal() {
            document.getElementById('modalOverlay').classList.remove('show');
            document.getElementById('novoProdutoNome').value = '';
            document.getElementById('novoProdutoSetor').value = '';
        }

        function adicionarNovoProduto() {
            const nome = document.getElementById('novoProdutoNome').value.trim();
            const setor = document.getElementById('novoProdutoSetor').value;

            if (!nome) {
                alert('Digite o nome do produto');
                return;
            }

            if (!setor) {
                alert('Selecione um setor');
                return;
            }

            const id = Date.now();
            
            if (!setoresConfig[setor]) {
                setoresConfig[setor] = [];
            }

            setoresConfig[setor].push({
                nome: nome,
                ideal: '-',
                isNovo: true,
                id: id
            });

            produtosNovos[nome] = {
                setor: setor,
                id: id,
                dataCadastro: new Date().toLocaleString('pt-BR')
            };

            localStorage.setItem('estoque_produtos_novos', JSON.stringify(produtosNovos));

            fecharModal();
            renderizarSetores();

            const successDiv = document.getElementById('successMsg');
            successDiv.innerHTML = `✓ Produto "${nome}" adicionado ao setor ${setor}`;
            successDiv.classList.add('show');
            setTimeout(() => {
                successDiv.classList.remove('show');
            }, 3000);
        }

        function deletarProdutoNovo(nome) {
            if (confirm(`Deletar "${nome}"?`)) {
                Object.keys(setoresConfig).forEach(setor => {
                    setoresConfig[setor] = setoresConfig[setor].filter(p => p.nome !== nome);
                });
                delete produtosNovos[nome];
                localStorage.setItem('estoque_produtos_novos', JSON.stringify(produtosNovos));
                renderizarSetores();
            }
        }

        function verificarSalvo(itemDiv, nomeProduto) {
            const inputQtd = itemDiv.querySelector(`input[id^="qtd_"]`);
            if (inputQtd && inputQtd.value.trim() !== '') {
                itemDiv.classList.add('salvo');
            } else {
                itemDiv.classList.remove('salvo');
            }
        }

        function renderizarSetores() {
            const setoresDiv = document.getElementById('setores');
            setoresDiv.innerHTML = '';

            Object.keys(setoresConfig).forEach(setor => {
                if (setoresConfig[setor].length === 0) return;

                const setorSection = document.createElement('div');
                setorSection.className = 'setor-section';
                
                const setorHeader = document.createElement('div');
                setorHeader.className = 'setor-header aberto';
                setorHeader.innerHTML = `
                    ${setor}
                    <i class="fas fa-chevron-right setor-icon"></i>
                `;
                
                const setorConteudo = document.createElement('div');
                setorConteudo.className = 'setor-conteudo aberto';
                
                setorHeader.onclick = () => toggleSetor(setorHeader, setorConteudo);
                
                setoresConfig[setor].forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'item-estoque' + (item.isNovo ? ' novo' : '');
                    
                    // Verificar se já tem valor salvo
                    if (dados[item.nome]) {
                        itemDiv.classList.add('salvo');
                    }
                    
                    let html = `
                        <div class="item-header">
                            <div class="item-nome-info">
                                <p class="item-nome">${item.nome}${item.isNovo ? '<span class="badge-novo">Novo</span>' : ''}</p>
                                <p class="item-info">Ideal: ${item.ideal}</p>
                            </div>
                            <div class="item-input-wrapper">
                                <div class="item-input">
                                    <label>QTD</label>
                                    <input type="number" id="qtd_${item.nome}" placeholder="0" step="0.01" value="${dados[item.nome] || ''}">
                                </div>
                                <div class="checkmark-badge">✓</div>
                            </div>
                        </div>
                    `;

                    if (item.isNovo) {
                        html += `
                            <div class="item-footer">
                                <button class="delete-btn" onclick="deletarProdutoNovo('${item.nome.replace(/'/g, "\\'")}')">
                                    <i class="fas fa-trash"></i> Deletar
                                </button>
                            </div>
                        `;
                    }

                    itemDiv.innerHTML = html;
                    
                    // Adicionar event listeners para verificar quando digita
                    const inputQtd = itemDiv.querySelector(`input[id^="qtd_"]`);
                    
                    function checkAndMark() {
                        if (inputQtd.value.trim() !== '') {
                            itemDiv.classList.add('salvo');
                        } else {
                            itemDiv.classList.remove('salvo');
                        }
                    }
                    
                    inputQtd.addEventListener('input', checkAndMark);
                    inputQtd.addEventListener('change', checkAndMark);
                    inputQtd.addEventListener('keyup', checkAndMark);
                    
                    setorConteudo.appendChild(itemDiv);
                });
                
                setorSection.appendChild(setorHeader);
                setorSection.appendChild(setorConteudo);
                setoresDiv.appendChild(setorSection);
            });
        }

        function toggleSetor(header, conteudo) {
            header.classList.toggle('aberto');
            conteudo.classList.toggle('aberto');
        }

        function salvarTodos() {
            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');

            let contagem = {};

            Object.keys(setoresConfig).forEach(setor => {
                setoresConfig[setor].forEach(item => {
                    const inputQtd = document.getElementById(`qtd_${item.nome}`);
                    
                    if (inputQtd && inputQtd.value.trim() !== '') {
                        contagem[item.nome] = parseFloat(inputQtd.value);
                    }
                });
            });

            if (Object.keys(contagem).length === 0) {
                errorDiv.innerHTML = 'Preencha a quantidade de pelo menos um produto';
                errorDiv.classList.add('show');
                return;
            }

            localStorage.setItem('estoque_contagem', JSON.stringify(contagem));
            localStorage.setItem('estoque_data', new Date().toLocaleString('pt-BR'));

            dados = contagem;

            successDiv.innerHTML = `✓ Contagem e compras salvas com sucesso em ${new Date().toLocaleTimeString('pt-BR')}`;
            successDiv.classList.add('show');

            // Marcar todos os itens com valor como salvos
            document.querySelectorAll('.item-estoque').forEach(item => {
                const inputQtd = item.querySelector('input[id^="qtd_"]');
                if (inputQtd && inputQtd.value.trim() !== '') {
                    item.classList.add('salvo');
                }
            });

            setTimeout(() => {
                successDiv.classList.remove('show');
            }, 5000);
        }

        carregarDados();
        renderizarSetores();
    </script>
</body>
</html>
